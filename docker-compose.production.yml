services:
  db:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no ambiente de produção}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-app5p}
      MYSQL_APP_USER: ${MYSQL_APP_USER:?Defina MYSQL_APP_USER no ambiente de produção}
      MYSQL_APP_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no ambiente de produção}

  web:
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Server=db;Port=3306;Database=${MYSQL_DATABASE:-app5p};User Id=${MYSQL_APP_USER:?Defina MYSQL_APP_USER no ambiente de produção};Password=${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no ambiente de produção};"
      DataProtection__KeysPath: ${DATA_PROTECTION_KEYS_PATH:-/root/.aspnet/DataProtection-Keys}
      DatabaseInitialization__ApplyMigrations: "false"
      DatabaseInitialization__EnsureCreatedIfNoTables: "false"
      DatabaseInitialization__RunCompatibilityPatches: "true"
